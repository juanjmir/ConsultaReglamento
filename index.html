<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Mi Asistente Virtual</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.71.1/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.71.1/build/stlite.js"></script>
    <script>
      // Aquí le decimos a Stlite que monte tu app y lea tus archivos de GitHub
      stlite.mount(
        {
          requirements: ["google-genai"], // Librería de Google
          entrypoint: "app.py",
          files: {
            "app.py": {
              url: "./app.py",
            },
            "fuente.txt": {
              url: "./fuente.txt",
            },
          },
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
