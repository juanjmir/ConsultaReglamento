<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Mi Asistente Virtual</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.71.1/build/stlite.css" />
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.71.1/build/stlite.js"></script>
  </head>
  <body>
    <div id="root"></div>
    
    <script>
      // Función para leer archivos externos de la misma carpeta
      async function leerArchivo(url) {
        const respuesta = await fetch(url);
        if (!respuesta.ok) {
          throw new Error(`No se pudo cargar el archivo: ${url}`);
        }
        return await respuesta.text();
      }

      // Proceso principal de carga
      async function iniciarChat() {
        try {
          // Buscamos y leemos los archivos externos en paralelo
          const [codigoPython, textoFuente] = await Promise.all([
            leerArchivo('./app.py'),
            leerArchivo('./fuente.txt')
          ]);

          // Montamos Stlite pasándole el contenido real de los archivos
          stlite.mount(
            {
              requirements: ["google-genai"],
              entrypoint: "app.py",
              files: {
                "app.py": codigoPython,
                "fuente.txt": textoFuente
              },
            },
            document.getElementById("root")
          );

        } catch (error) {
          console.error("Error crítico al iniciar la aplicación:", error);
          document.getElementById("root").innerHTML = `
            <div style="color:red; text-align:center; margin-top:50px; font-family:sans-serif;">
              <h3>Error al cargar el asistente</h3>
              <p>${error.message}</p>
              <p>Asegúrate de estar ejecutando el servidor local con Python.</p>
            </div>`;
        }
      }

      // Arrancar cuando la página web esté lista
      window.addEventListener('DOMContentLoaded', iniciarChat);
    </script>
  </body>
</html>
